[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hedfpy"
dynamic = ["version"]
description = "convert SR Research eyelink edf output to tabular hdf5 format"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Tomas Knapen", email = "tknapen@gmail.com" }]
maintainers = [{ name = "Tomas Knapen", email = "tknapen@gmail.com" }]
keywords = ["eyetracking", "eyelink", "pupillometry", "edf", "hdf5", "psychophysics"]
classifiers = [
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Scientific/Engineering',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]

requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "statsmodels",
    "scikit-learn",
    "lmfit",
    "mne",
    "tables",
    "h5py",
    'tomli; python_version < "3.11"',
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/tknapen/hedfpy"
Repository = "https://github.com/tknapen/hedfpy"

[tool.setuptools]
packages = ["hedfpy"]
package-data = { hedfpy = ['grammar.toml'] }

[tool.setuptools.dynamic]
version = { attr = "hedfpy.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# hedfpy still triggers some third-party deprecation warnings; these are
# tightened up as the modernization of the refactor continues.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
